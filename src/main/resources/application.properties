spring.application.name=tic-tac-toe-backend
server.port=8080
ai-catalog-api.url=http://localhost:3000/api/tictactoe
game-state-service.ai-uuid=0e5ce7dd-c39c-4475-a52c-c0b85edd2074

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true

spring.datasource.url=jdbc:postgresql://localhost:5443/postgres?currentSchema=tictactoe
spring.datasource.username=user
spring.datasource.password=password

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.data-locations=classpath:sql/data.sql

